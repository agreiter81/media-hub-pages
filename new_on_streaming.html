<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Streaming This Week · Media Hub</title>
<!-- hub_shell -->
<style>

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
       background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }


/* ── Shared Media Hub nav (hub_theme.py) ─────────────────────────────────── */
.mh-nav { position: sticky; top: 0; z-index: 1000; width: 100%; box-sizing: border-box;
          background: rgba(20,20,31,0.92); -webkit-backdrop-filter: blur(10px);
          backdrop-filter: blur(10px); border-bottom: 1px solid #22223a;
          display: flex; align-items: center; gap: 18px; padding: 11px 24px;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
.mh-nav .mh-brand { font-size: 1.02em; font-weight: 800; color: #fff; text-decoration: none;
                    white-space: nowrap; letter-spacing: -0.01em; }
.mh-nav .mh-links { display: flex; gap: 4px; flex-wrap: wrap; }
.mh-nav a.mh-link { color: #9a9ab0; text-decoration: none; font-size: 0.83em; font-weight: 600;
                    padding: 6px 12px; border-radius: 8px; transition: background .15s, color .15s; }
.mh-nav a.mh-link:hover  { color: #fff; background: #22223a; }
.mh-nav a.mh-link.active { color: #fff; background: #4a90e2; }
@media (max-width: 640px) {
  .mh-nav { gap: 10px; padding: 9px 14px; }
  .mh-nav a.mh-link { padding: 5px 9px; font-size: 0.8em; }
}
/* ── Hub-wide search (in the nav, on every page) ──────────────────────────── */
.mh-search-wrap { position: relative; margin-left: auto; }
.mh-search { background: #2a2a3e; border: 1px solid #3a3a5e; color: #e0e0e0; font-size: 0.82em;
             padding: 6px 12px; border-radius: 18px; width: 190px; outline: none; transition: width .15s, border-color .15s;
             font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
.mh-search:focus { width: 240px; border-color: #4a90e2; }
.mh-search::placeholder { color: #777; }
.mh-results { display: none; position: absolute; top: calc(100% + 6px); right: 0; width: 360px; max-width: 82vw;
              max-height: 72vh; overflow-y: auto; background: #14141f; border: 1px solid #2a2a3e; border-radius: 12px;
              box-shadow: 0 12px 40px rgba(0,0,0,0.6); z-index: 1001; padding: 6px; }
.mh-result { display: flex; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 8px; text-decoration: none; }
.mh-result:hover { background: #20202f; }
.mh-result img { width: 34px; height: 51px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
.mh-result .mh-noimg { width: 34px; height: 51px; border-radius: 4px; background: #2a2a3e; display: flex;
                       align-items: center; justify-content: center; font-size: 1.1em; flex-shrink: 0; }
.mh-rinfo { min-width: 0; }
.mh-rtitle { color: #fff; font-size: 0.84em; font-weight: 600; line-height: 1.25; }
.mh-rtitle span { color: #777; font-weight: 400; }
.mh-rsrc { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.mh-src { font-size: 0.64em; font-weight: 700; color: #b9b9d0; background: #23233a; padding: 2px 6px; border-radius: 6px; }
.mh-noresult { color: #777; font-size: 0.82em; padding: 16px; text-align: center; }
@media (max-width: 640px) { .mh-search { width: 120px; } .mh-search:focus { width: 150px; } }
/* ── Shared sub-tab strip (e.g. On TV: Guide / Episodes) ──────────────────── */
.mh-subnav { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 24px 0;
             font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
.mh-subnav a { text-decoration: none; font-size: 0.82em; font-weight: 700; color: #9a9ab0;
               background: #16162a; border: 1px solid #2a2a3e; padding: 7px 15px;
               border-radius: 10px; transition: all .15s; }
.mh-subnav a:hover { color: #fff; border-color: #4a90e2; }
.mh-subnav a.active { color: #fff; background: #4a90e2; border-color: #4a90e2; }


.hub-page { max-width: 1280px; margin: 0 auto; padding: 0 0 60px; }
.hub-head { padding: 22px 20px 6px; }
.hub-head .eyebrow { color: #666; font-size: .8em; }
.hub-head h1 { font-size: 1.5em; font-weight: 800; margin-top: 2px; color: #fff; }
.hub-head .sub { color: #888; font-size: .85em; margin-top: 4px; max-width: 760px; }
.hub-foot { text-align: center; color: #444; font-size: .75em; padding: 30px 20px 10px; }
/* A titled section containing a grid — the home page and Watch Tonight each had
   their own `.section`, with different padding. Heading and blurb carry the side
   inset; the section box carries none, so the grid inside is full width. */
.hub-section { padding: 22px 0 0; }
.hub-section h2 { font-size: 1.05em; color: #fff; margin-bottom: 4px; padding: 0 20px; }
.hub-section .desc { font-size: .78em; color: #666; margin-bottom: 14px; padding: 0 20px; }
.hub-divider { border: none; border-top: 1px solid #1e1e30; margin: 26px 0; }
/* A dated group heading above a grid. Was written in three files; the copy that
   had lost its side inset is why "Tuesday, September 1" sat against the edge. */
.date-h { font-size: 1.02em; font-weight: 700; color: #4a90e2; border-bottom: 1px solid #22223a;
          padding: 14px 20px 7px; margin: 22px 0 4px; }


.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 20px 0; }
.tab-group { display: flex; gap: 4px; }
.tab { background: #2a2a3e; border: none; color: #aaa; padding: 5px 12px;
       border-radius: 20px; cursor: pointer; font-size: 0.82em; transition: all 0.15s; }
.tab.active { background: #4a90e2; color: white; }
.tab:hover:not(.active) { background: #3a3a5e; color: #ddd; }
.search { background: #2a2a3e; border: 1px solid #3a3a5e; color: #e0e0e0;
          padding: 5px 12px; border-radius: 20px; font-size: 0.82em; width: 180px; }
.search:focus { outline: none; border-color: #4a90e2; }
.hide-opts { display: flex; gap: 10px; }
.hide-opts label { font-size: 0.78em; color: #888; cursor: pointer; display: flex; gap: 4px; align-items: center; }
.hide-opts input { cursor: pointer; }
.stats { font-size: 0.75em; color: #666; margin-left: auto; }
.cat-toggle { display: none; }
/* streaming filter bar */
.provider-bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 7px 20px 8px;
                border-top: 1px solid #1e1e30; align-items: center; }
.provider-bar-label { font-size: 0.72em; color: #555; margin-right: 2px; }
.provider-btn { background: #2a2a3e; border: 2px solid transparent; border-radius: 8px;
                cursor: pointer; padding: 3px; transition: all 0.15s; }
.provider-btn img { width: 28px; height: 28px; border-radius: 5px; display: block; }
.provider-btn.active { border-color: #4a90e2; box-shadow: 0 0 6px rgba(74,144,226,0.5); }
.provider-btn:hover:not(.active) { border-color: #3a3a5e; }
/* genre filter bar */
.genre-bar { border-top: 1px solid #1e1e30; padding: 7px 20px 8px; }
.genre-bar-label { font-size: 0.72em; color: #555; cursor: pointer; user-select: none; display: inline-block; margin-bottom: 4px; }
.genre-bar-label:hover { color: #888; }
.genre-chips { display: flex; flex-wrap: wrap; gap: 5px; max-height: 62px; overflow: hidden;
               transition: max-height 0.3s ease; }
.genre-chips.expanded { max-height: 300px; }
.genre-chips.collapsed { max-height: 0; overflow: hidden; }
.genre-chip { background: #2a2a3e; color: #888; padding: 3px 10px;
              border-radius: 12px; font-size: 0.72em; cursor: pointer;
              border: 1px solid transparent; user-select: none; white-space: nowrap; }
.genre-chip.active { background: #4a90e2; color: #fff; border-color: #4a90e2; }
.genre-chip:hover:not(.active) { background: #3a3a5e; color: #ccc; }
.genre-chip.show-more { color: #4a90e2; background: transparent; border-color: #3a3a5e; }
.sort-group { display: flex; gap: 4px; align-items: center; }
.sort-lbl { font-size: 0.72em; color: #888; }
#sort-sel { background: #2a2a3e; border: 1px solid #3a3a5e; color: #ddd;
            padding: 3px 6px; border-radius: 8px; cursor: pointer; font-size: 0.72em; }


.idpick-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 3000;
                  align-items: flex-start; justify-content: center; padding: 40px 16px; }
.idpick-modal { background: #14141f; border: 1px solid #2a2a3e; border-radius: 14px; width: 460px;
                max-width: 94vw; max-height: 82vh; overflow-y: auto; padding: 18px 18px 22px; position: relative; }
.idpick-modal h3 { color: #fff; font-size: 1em; margin-bottom: 12px; padding-right: 24px; }
.idpick-close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: #888;
                font-size: 1.5em; cursor: pointer; line-height: 1; }
.idpick-close:hover { color: #fff; }
.idpick-results { display: flex; flex-direction: column; gap: 6px; }
.idpick-loading { color: #888; font-size: 0.85em; padding: 20px; text-align: center; }
.idpick-item { display: flex; gap: 10px; align-items: center; text-align: left; width: 100%; background: #1c1c2b;
               border: 1px solid transparent; border-radius: 10px; padding: 7px 9px; cursor: pointer; }
.idpick-item:hover { border-color: #8e44ad; background: #20202f; }
.idpick-item.picked { border-color: #4CAF50; }
.idpick-item.idpick-none { border: 1px dashed #4a4a5e; }
.idpick-item img { width: 40px; height: 60px; object-fit: cover; border-radius: 5px; flex-shrink: 0; }
.idpick-noimg { width: 40px; height: 60px; border-radius: 5px; background: #2a2a3e; display: flex;
                align-items: center; justify-content: center; font-size: 1.2em; flex-shrink: 0; }
.idpick-meta { min-width: 0; }
.idpick-title { color: #fff; font-size: 0.86em; font-weight: 600; }
.idpick-title span { color: #888; font-weight: 400; }
.idpick-sub { color: #9a9ab0; font-size: 0.74em; margin-top: 2px; }



/* A card is exactly as tall as what it holds — like the description, which expands
   and contracts. This grid used to force every row to the height of the single
   tallest card, and the card reserved an invisible slot for every row it MIGHT have
   (on TV, next episode, progress, last watched, a coming-to badge), so most cards
   carried 60-120px of blank. "The same card everywhere" means the same card, not
   the same number of pixels: a card with more on it may be taller. Decided from a
   side-by-side mockup, 2026-09-13. */
.grid { display: grid; align-items: start;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 14px; padding: 16px 20px; }
/* The home page's rows: a horizontal scroller of the SAME card. The one deliberate
   size exception in the hub — a rail card is a fixed width, not a grid column's —
   confirmed as intended 2026-09-06. Lived in hub_page.py until Step G; a card layout
   belongs with the card. NOTHING here may change the card itself, only how the row
   scrolls. */
.card-rail { display: flex; gap: 14px; overflow-x: auto; padding: 4px 20px 14px;
             scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
             scrollbar-width: thin; scrollbar-color: #333 transparent; }
.card-rail .card { flex: 0 0 200px; scroll-snap-align: start; }
.card-rail::-webkit-scrollbar { height: 8px; }
.card-rail::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 4px; }
@media (max-width: 600px) { .card-rail .card { flex: 0 0 150px; } }
.card { background: #1e1e30; border-radius: 10px; overflow: hidden;
        transition: transform 0.15s, box-shadow 0.15s; display: flex; flex-direction: column; }
.card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
/* Watched titles are NOT dimmed anywhere in the hub (user preference). */
.card.status-watched { opacity: 1; }
.card.status-watchlist { box-shadow: 0 0 0 2px #f5c518; }
.poster { position: relative; aspect-ratio: 2/3; background: #2a2a3e; overflow: hidden; }
.poster img { width: 100%; height: 100%; object-fit: cover; }
.poster .no-poster { display: flex; align-items: center; justify-content: center;
                     height: 100%; font-size: 3em; color: #3a3a5e; }
/* right:6px + wrapping so a long badge ("🆕 Season 2 Premiere · Sep 12") stays inside
   a 200px card instead of running off the poster. This lived as a home-page-only
   override, which meant the SAME card clipped its badges on every other page. */
.cat-badges { position: absolute; top: 6px; left: 6px; right: 6px; display: flex;
              flex-direction: column; align-items: flex-start; gap: 3px; }
.cat-badge { font-size: 0.62em; font-weight: bold; padding: 2px 6px; border-radius: 8px;
             backdrop-filter: blur(4px); white-space: normal; line-height: 1.25;
             max-width: 100%; }
.cat-badge.trending   { background: rgba(231,76,60,0.85); color: white; }
.cat-badge.anticipated { background: rgba(155,89,182,0.85); color: white; }
.cat-badge.popular    { background: rgba(39,174,96,0.85); color: white; }
.cat-badge.watched-cat { background: rgba(52,152,219,0.85); color: white; }
.cat-badge.recommendations { background: rgba(230,126,34,0.85); color: white; }
.cat-badge.new-badge { background: rgba(255,165,0,0.9); color: white; }
.cat-badge.leaving { background: rgba(230,126,34,0.9); color: white; }
.cat-badge.leaving.urgent { background: rgba(231,76,60,0.92); color: white; }
/* THE BADGE TONES. Every badge a page can ask for is styled HERE, once.
   Pages used to paste raw HTML into the card with their own inline colours, so the
   same idea — "the service", "when it airs", "why this is here" — was a different
   colour depending which page you were on. A page now names the MEANING and the
   card owns the look. */
.cat-badge.tone-pick     { background: rgba(243,156,18,0.92); color: #fff; }
.cat-badge.tone-when     { background: rgba(44,62,80,0.92);   color: #cfe3ff; }
.cat-badge.tone-service  { background: rgba(45,90,45,0.92);   color: #fff; }
.cat-badge.tone-owned    { background: rgba(245,197,24,0.94); color: #111; }
.cat-badge.tone-why      { background: rgba(192,57,43,0.92);  color: #fff; }
.cat-badge.tone-match    { background: rgba(76,175,80,0.92);  color: #fff; }
/* Where a search result came from — a colour-coded set, kept as one set. */
.cat-badge.tone-library  { background: rgba(58,58,94,0.92);   color: #fff; }
.cat-badge.tone-discover { background: rgba(74,144,226,0.92); color: #fff; }
.cat-badge.tone-arriving { background: rgba(45,90,45,0.92);   color: #fff; }
.cat-badge.tone-leaving  { background: rgba(138,75,30,0.92);  color: #fff; }
.cat-badge.tone-premiere { background: rgba(107,63,160,0.92); color: #fff; }
.cat-badge.tone-ontv     { background: rgba(31,58,95,0.92);   color: #cfe3ff; }
.cat-badge.premiere-tag.is-premiere { background: rgba(46,125,70,0.92); color: white; }
.cat-badge.premiere-tag.is-finale { background: rgba(179,64,47,0.92); color: white; }
.type-badge { position: absolute; top: 6px; right: 6px; font-size: 1em;
              background: rgba(0,0,0,0.6); border-radius: 6px; padding: 2px 5px; }
.info { padding: 10px; flex: 1; display: flex; flex-direction: column; gap: 5px; }

/* EVERY BLOCK ABOVE THE DESCRIPTION IS CAPPED, so a card's chrome is a constant
   height and the description absorbs whatever is left. Without these caps each block
   grew to fit its own content — a 5-line title here, four rows of service logos
   there — and on a 375px phone that put a 312px spread across 3,785 cards: 502px
   tall at the shortest, 814px at the tallest. Cards in the SAME ROW always matched
   (the grid stretches them); it was row against row that never did, which is what
   you see scrolling. The caps stay; the row-equalising did not (see .grid). */
.title { font-weight: 700; font-size: 0.88em; line-height: 1.3; color: #fff;
         display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
         overflow: hidden; min-height: 2.6em; }
.title .year { font-weight: 400; color: #888; font-size: 0.85em; margin-left: 4px; }
/* Stars, certificate, runtime, release date, venue and leaving badges all live on
   this one line and wrapped to three on a narrow card. */
/* Two lines reserved. Star + votes + certificate + runtime fits on one line for some
   titles and wraps for others; that one row was the last thing making cards in
   different grids come out different heights (18px vs 36px, measured 2026-09-11). */
.rating { font-size: 0.75em; color: #f5c518; line-height: 1.5; min-height: 3em;
          max-height: 3em; overflow: hidden; }
.rating .votes { color: #666; }
.genres { display: flex; flex-wrap: wrap; gap: 3px; min-height: 20px; max-height: 20px;
          overflow: hidden; }
.genre { font-size: 0.65em; background: #2a2a3e; color: #aaa; padding: 2px 6px;
         border-radius: 8px; }
.providers { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px;
             min-height: 24px; max-height: 24px; overflow: hidden; }
/* The cast row. This was never in the shared card at all — My Library and Discovery
   each defined `.actors` for themselves, with their own font sizes inside their own
   media queries, and the check for pages restyling the card did not know the class
   existed. Four chips stack four rows deep on a phone, which was the single biggest
   source of the height difference between one row of cards and the next. */
.actors { font-size: 0.7em; color: #888; line-height: 1.3; display: flex;
          flex-wrap: wrap; gap: 3px; min-height: 52px; max-height: 52px;
          overflow: hidden; }
.actor-chip { cursor: pointer; transition: color 0.15s; display: inline-flex;
              align-items: center; gap: 3px; }
.actor-chip:hover { color: #4a90e2; text-decoration: underline; }
.actor-chip img { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }
.actor-chip.active-actor { color: #4a90e2; font-weight: 700; }
.providers img { width: 24px; height: 24px; border-radius: 4px; object-fit: cover; }
.prov-text { font-size: 0.6em; background: #2a2a3e; color: #aaa; padding: 2px 6px;
             border-radius: 4px; white-space: nowrap; }
/* Description: clamp to 3 lines (no fiddly inner scroll), tap/click to expand to full. */
.overview { font-size: 0.73em; color: #999; line-height: 1.4; cursor: pointer;
            display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
            overflow: hidden; }
.overview.expanded { -webkit-line-clamp: unset; overflow: visible; }

/* TAP A CARD TO OPEN IT OUT. Every cap above exists so cards line up in the grid,
   which means a long title, a fifth cast member or a fourth row of logos is trimmed.
   Nothing is lost — one tap lifts every cap on that card at once and it grows to fit,
   pushing its row down. Tap again to close. Same idea as tapping the description,
   extended to the whole card, so there is one gesture rather than two.
   `.card` sets overflow:hidden for its rounded corners, so the open state has to
   release that too or the extra content is clipped by the card itself. */
/* A row that IS there keeps one fixed height, so the same row is the same size on
   every card. A row that is not there takes no space at all. */
.prog-wrap { height: 27px; overflow: hidden; }
.ctx-badges { height: 30px; white-space: nowrap; overflow: hidden; }
.card.open .next-ep { height: auto; -webkit-line-clamp: unset; }

.card.open { overflow: visible; z-index: 2; }
.card.open .title,
.card.open .rating,
.card.open .genres,
.card.open .actors,
.card.open .providers { -webkit-line-clamp: unset; max-height: none; overflow: visible; }
.card.open .overview { -webkit-line-clamp: unset; overflow: visible; }
.card-expand { align-self: flex-start; background: none; border: 0; cursor: pointer;
               color: #4a90e2; font-size: 0.68em; font-weight: 600; padding: 2px 0 0;
               font-family: inherit; }
.card-expand:hover { text-decoration: underline; }
.add-btn { margin-top: 8px; padding: 0 10px; border: none; border-radius: 8px;
           cursor: pointer; font-size: 0.75em; font-weight: 600; width: 100%;
           height: 32px; line-height: 32px; overflow: hidden; white-space: nowrap;
           transition: all 0.15s; }
/* Fixed height: "+ Add to Watchlist" rendered 26px and "👁 Already Watched" 32px — the
   emoji sets the line taller — so two cards with different statuses were different
   heights, and a grid holding one of each was taller than a grid holding neither. */
.add-btn.none      { background: #4a90e2; color: white; }
.add-btn.none:hover { background: #357abd; }
.add-btn.watchlist { background: #2a4a2e; color: #4CAF50; cursor: default; }
.add-btn.watched   { background: #2a2a3e; color: #666; cursor: default; }
.add-btn.added     { background: #1a4a1e; color: #4CAF50; cursor: default; }
.add-btn.loading   { background: #3a3a5e; color: #aaa; cursor: default; }
.add-btn.error     { background: #4a1a1e; color: #e74c3c; cursor: pointer; }
.watched-btn { background: #8e44ad !important; }
.watched-btn:hover { background: #9b59b6 !important; }
.not-interested-btn { background: #3a2a2a !important; color: #888 !important; }
.not-interested-btn:hover { background: #4a2a2a !important; color: #aaa !important; }
.show-hidden-btn { background: none; border: 1px solid #555; color: #888; padding: 4px 12px;
                   border-radius: 16px; cursor: pointer; font-size: 0.75em; margin-left: 8px; }
.show-hidden-btn:hover { border-color: #888; color: #bbb; }
.show-hidden-btn.active { border-color: #e74c3c; color: #e74c3c; }
.reset-btn { background: #e74c3c; border: none; color: #fff; padding: 6px 14px;
             border-radius: 20px; cursor: pointer; font-size: 0.82em; font-weight: 600;
             transition: transform 0.15s; animation: reset-pulse 1.5s ease-in-out infinite; }
.reset-btn:hover { transform: scale(1.05); background: #c0392b; }
@keyframes reset-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(231,76,60,0.4); } 50% { box-shadow: 0 0 8px 3px rgba(231,76,60,0.3); } }
.trakt-link { font-size: 0.68em; color: #555; text-align: center; text-decoration: none;
              margin-top: 3px; display: block; height: 1.7em; line-height: 1.7em; overflow: hidden; }
/* One fixed height per link line. A line with an emoji rendered 18px and one without
   13px, so two cards with the same links could still differ by a few pixels. */
.trakt-link:hover { color: #888; }
/* Library (Layer 2): TV progress bar, last-watched, coming/leaving context badges */

.prog-fill { height: 100%; background: #4CAF50; border-radius: 3px; }
.prog-label { font-size: 0.62em; color: #888; margin-top: 2px; }
.ep-info { font-size: 0.66em; color: #888; margin-top: 3px; }
.last-seen { font-size: 0.62em; color: #666; margin-top: 2px; }
/* How long a title has sat on the list — four steps, cool to hot. The Library used

   through an item.extra_html hatch: the same hole as top_badges_html, still open
   after that one was closed. */
/* Where it premieres: in a cinema, on a service, or on a channel. */
.venue-badge { display: inline-block; padding: 1px 6px; border-radius: 8px; font-size: 10px;
               font-weight: 600; color: #fff; margin-left: 4px; background: rgba(33,150,243,0.92); }
.venue-badge.theater   { background: rgba(231,76,60,0.92); }
.venue-badge.streaming { background: rgba(39,174,96,0.92); }
.age-badge { display: inline-block; font-size: 0.62em; font-weight: 600; padding: 1px 6px;
             border-radius: 8px; }
.age-badge.fresh  { background: rgba(39,174,96,0.13);  color: #27ae60; border: 1px solid #27ae60; }
.age-badge.months { background: rgba(241,196,15,0.13); color: #f1c40f; border: 1px solid #f1c40f; }
.age-badge.years  { background: rgba(230,126,34,0.13); color: #e67e22; border: 1px solid #e67e22; }
.age-badge.stale  { background: rgba(231,76,60,0.13);  color: #e74c3c; border: 1px solid #e74c3c; }
.leave-badge { display: inline-block; padding: 1px 6px; border-radius: 8px; font-size: 10px;
               font-weight: 700; color: #fff; background: rgba(230,126,34,0.92); margin-left: 4px; }
.leave-badge.urgent { background: rgba(231,76,60,0.94); }
.svc-icon { width: 14px; height: 14px; border-radius: 3px; object-fit: cover;
            vertical-align: -2px; margin: 0 3px 0 1px; }
.coming-to { display: inline-block; font-size: 0.62em; font-weight: 600; color: #4CAF50;

.leaving-badge { display: inline-block; font-size: 0.62em; font-weight: 600; color: #e67e22;

.find-title-btn:hover { background: #3a3a5e; color: #ddd; }
/* Per-item: 🔧 Wrong title? (in-development) */
.fix-id-btn { margin-top: 6px; width: 100%; padding: 5px 10px; border: 1px dashed #8e44ad;
              background: transparent; color: #b07cd6; border-radius: 8px; cursor: pointer; font-size: 0.72em; }
.fix-id-btn:hover { background: rgba(142,68,173,0.15); color: #d9a6ff; }
/* Per-item: ✕ Not in development — graduates an already-released stub onto the watchlist */
.rm-indev-btn { margin-top: 6px; width: 100%; padding: 5px 10px; border: 1px dashed #556;

           line-height: 1.35; height: 2.7em; overflow: hidden;
           display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }

   Tomorrow 8:00 PM (+3 more)" wraps to two. Each card carries two of these (next episode,
   next airing), so the row was 30, 46 or 59px tall depending on the title, and that was
   the last thing making cards in different grids different heights (2026-09-11). */
.next-air { color: #cfe3ff; }
.empty { grid-column: 1/-1; text-align: center; color: #555; padding: 40px; font-size: 0.9em; }

.play-overlay { position: absolute; inset: 0; display: flex; align-items: center;
                justify-content: center; background: rgba(0,0,0,0.35); opacity: 0.7;
                transition: opacity 0.2s; cursor: pointer; z-index: 5; }
.poster:hover .play-overlay { opacity: 1; }

.play-overlay:hover .play-icon { transform: scale(1.1); }

@media (max-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px; } }

// Shared Media Hub card — single source of truth for a title card.
// renderCard(item) returns the exact Discovery card HTML. Every page that shows title
// cards uses THIS. Interactions are self-contained (PIN add / mark-watched hit the
// worker; trailer opens YouTube; not-interested falls back to removing the card when
// a page has no renderAll()).
// Server-synced "Not Interested": hides persist to a Notion DB (via the worker) so a hide
// on one device applies on every device. The UI filters on this device's pending hides ∪
// the server's set. A page opts in to cross-device hiding by calling loadServerNotInterested()
// on load; pages that only need local dismissal still work (renderAll()/card removal fallback).
const NI_KEY = 'discovery_not_interested';
const NI_API = 'https://media-hub-api.agreiter81.workers.dev/api/not-interested';
let serverNISet = new Set();   // ids the server already has (fetched on load, if opted in)
function getLocalNISet() {
    try { return new Set(JSON.parse(localStorage.getItem(NI_KEY) || '[]')); }
    catch { return new Set(); }

        // "🆕 Season 4 Premiere · Aug 12".
        const pt = item.premiere_tag;
        const ptBadge = (pt && pt.label)
            ? `<span class="cat-badge premiere-tag ${pt.kind === 'finale' ? 'is-finale' : 'is-premiere'}">${pt.label}${pt.date ? ' · ' + premShortDate(pt.date) : ''}</span>`
            : '';

        // ── Layer 1: action cluster (Add / Mark Watched / Not Interested) ──
        const actionBtns = showActions ? `
    <button class="add-btn ${btnClass}" onclick="addToWatchlist('${item.type}', ${item.trakt_id}, ${item.tmdb_id}, '${item.slug}', this)"
            ${item.status !== 'none' ? 'disabled' : ''}>${btnText}</button>
    <button class="add-btn watched-btn" onclick="markAsWatched('${item.type}', ${item.tmdb_id}, this)"
            ${item.status === 'watched' ? 'disabled' : ''}>${item.status === 'watched' ? '👁 Already Watched' : '👁 Mark Watched'}</button>
    <button class="add-btn not-interested-btn" onclick="notInterested(${item.tmdb_id}, this)">🚫 Not Interested</button>` : '';

        // ── Per-item: 🔧 Wrong title? (in-development titles only) ──
        const isIndev = (item.categories || []).indexOf('in_development') !== -1;
        const fixIdBtn = (isIndev && item.notion_id)
            ? `<button class="fix-id-btn" data-nid="${item.notion_id}" data-title="${(item.title||'').replace(/"/g,'&quot;')}" data-type="${item.type}" onclick="openIdPicker(this)">🔧 Wrong title?</button>`
            : '';
        // ── Per-item: ✕ Not in development (in-development titles only) — graduate to watchlist ──
        const removeIndevBtn = (isIndev && item.notion_id)
            ? `<button class="rm-indev-btn" data-nid="${item.notion_id}" data-type="${item.type}" onclick="removeFromDevelopment(this)">✕ Not in development</button>`
            : '';

        // ── Layer 3: 🔍 Find Similar (Library) ──
        const findSimilarBtn = opts.findSimilar
            ? `<button class="find-title-btn" onclick="event.preventDefault();findMoreLikeTitle('${item.type}',${item.tmdb_id||0},'${safeTitle}')">🔍 Find Similar</button>`
            : '';

        // ── Layer 2: library context (progress, last-watched, coming/leaving, escape hatch) ──
        let progressHtml = '', lastWatchedHtml = '', ctxBadges = '';
        if (opts.library) {
            const p = item.progress;
            if (p && p.total) {
                const pct = Math.min(100, Math.round((p.watched || 0) / p.total * 100));
                progressHtml = `<div class="prog-wrap"><div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div><div class="prog-label">${p.watched || 0} / ${p.total} eps watched</div></div>`;
            } else if (p && p.watched) {
                progressHtml = `<div class="ep-info">${p.watched} episodes watched</div>`;
            } else {
                progressHtml = '';
            }
            // A SERVICE IS A LOGO IN THIS HUB — including in these two badges. They
            // named the service in WORDS while every other mention of a service on the
            // card is an icon, so "Coming to Paramount+ today" sat above an empty logo
            // strip and read as a missing logo. It is not: the strip lists where a
            // title streams TODAY, and this one arrives today — a different fact. Draw
            // the icon beside the words and the two stop looking like a contradiction.
            // "Leaving X" used to be drawn HERE TOO, from a second field called
            // leaving_soon whose contents were byte-identical to item.leaving — the
            // Library wrote one name, Streaming wrote the other, and the card drew each
            // in its own place in its own style. One field, one badge, drawn above with
            // every other page's.
            const ct = item.coming_to;
            if (ct) ctxBadges += `<span class="coming-to">🟢 Coming to ${_svcIcon(ct.platform)}${ct.platform} ${ct.days === 0 ? 'today' : 'in ' + ct.days + ' day' + (ct.days===1?'':'s')}</span>`;
            // DECLARED, NOT DRAWN — the same rule as the corner badges. item.extra_html
            // took raw HTML from the page and was the last hole of its kind left after
            // top_badges_html was removed. A page now says what the badge MEANS and the
            // card owns how it looks.
            const ag = item.age_badge;
            if (ag && ag.text) {
                const tone = ['fresh','months','years','stale'].includes(ag.tone) ? ag.tone : 'fresh';
                ctxBadges += `<span class="age-badge ${tone}">${String(ag.text)
                    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>`;
            }
            lastWatchedHtml = item.last_watched
                ? `<div class="last-seen">Last watched: ${item.last_watched}</div>`
                : '';
        }

        return `<div class="card status-${item.status}" data-id="${item.trakt_id}" data-type="${item.type}">
  <div class="poster">
    ${poster}
    ${playOverlay}
    <div class="cat-badges">${ptBadge}${ownBadges}${catBadges}</div>
    <div class="type-badge">${typeIcon}</div>
  </div>
  <div class="info">
    <div class="title">${item.title}${yearHtml}</div>
    <div class="rating">${rating}${certHtml}${rtHtml}${relDate}${venueBadge}${leavingBadge}</div>
    <div class="genres">${genres}</div>
    ${nextEpHtml}
    ${nextAirHtml}
    ${progressHtml}
    <div class="actors">${actorChips}</div>
    <div class="providers">${providers}</div>
    ${ctxBadges ? `<div class="ctx-badges">${ctxBadges}</div>` : ''}
    ${lastWatchedHtml}
    <div class="overview" onclick="event.stopPropagation(); toggleCardOpen(this)" title="Tap to open the whole card">${overview}</div>
    <button class="card-expand" onclick="event.stopPropagation(); toggleCardOpen(this)">Show more</button>
    ${actionBtns}
    ${trailerLink}
    ${ytvLink}
    ${ytvOpenBtn}
    ${ytvMarkBtn}
    ${ytvWrongBtn}
    ${extLink}
    ${notionLink}
    ${fixIdBtn}
    ${removeIndevBtn}
    ${findSimilarBtn}
  </div>
</div>`;
}



// ── Map a library movie/show object → the shared renderCard item shape ────────
// PASS-THROUGH BY DEFAULT. This used to be a hand-written allow-list that named
// every field one by one, so any NEW card field that nobody remembered to add
// here silently vanished from Library cards only — it cost us next_air and
// premiere_tag (2026-08-10) and cert (2026-08-28). Now we spread the library
// item first and only override what genuinely needs reshaping, so a new field
// reaches the Library card the moment the data populates it. Do NOT convert
// this back into an explicit field list.
//
// The legacy-name reads below (it.rating || it.vote_average) accept EITHER
// spelling, so the Library's raw-TMDB names can be renamed to the card's names
// incrementally without a flag day — both work during the transition.
// THE TRANSLATOR IS GONE. This used to rename eight fields (vote_average→rating,
// platforms→providers, show_id→tmdb_id, trakt_slug→slug, …) because the Library
// stored its items under the raw Notion/TMDB spellings. It now stores them under
// the canonical names (title_shape), so there is nothing left to translate — and
// nothing left to forget, which is what silently dropped next_air, premiere_tag
// and cert from Library cards on three separate occasions.
//
// What remains is NOT translation. It is the handful of things that are genuinely
// specific to the Library page's cards. Do NOT let field renaming creep back in
// here: if a name needs converting, convert it at the source instead.
function libToCardItem(it, type) {
    // The status arrives in the card's own vocabulary now. The Library used to write
    // 'to_watch' where the card says 'watchlist', and this line converted it — a
    // translation that existed only because two readers of the same Notion database
    // had been written separately. Both now go through title_shape.from_notion_props,
    // so there is one word for the state and nothing to convert.
    const status = (it.status === 'watched' || it.status === 'watchlist') ? it.status : 'none';
    // How long it has sat on the list — a Library-only fact, so the page works it out,
    // but it says what it MEANS ({text, tone}) and card_ui decides how it looks. It used
    // to hand over finished HTML with its own four colours.
    const age = (typeof getAgingBadge === 'function' ? getAgingBadge(it) : null);
    return Object.assign({}, it, {
        type,
        status,
        // A provider with no logo can't be drawn; keep the shape, backfill a logo
        // the page knows about, and drop the ones that still have none.
        providers: (it.providers || [])
            .map(p => (p.logo ? p : { name: p.name, logo: _providerLogo(p.name) }))
            .filter(p => p.name && p.logo),
        // A release date on a title you already own is noise — you know when
        // Jaws came out. A date still to COME is the useful half: it says the
        // thing you are waiting for has a date now. So keep future dates, drop
        // past ones, rather than blanking the field for everything.
        release_date: (it.release_date && it.release_date.slice(0, 10) > new Date().toISOString().slice(0, 10))
                      ? it.release_date : '',
        categories: [],
        age_badge: age
    });
}
// Library cards = shared baseline + library context + Find Similar; NO acquisition buttons.
function renderMovieCard(m) {
    return renderCard(libToCardItem(m, 'movie'), { actions: false, library: true, findSimilar: true });
}
function renderTVCard(s) {
    return renderCard(libToCardItem(s, 'tv'), { actions: false, library: true, findSimilar: true });
}


const PROVIDER_NORMALIZE = {
    'Netflix': 'Netflix',
    'Netflix Standard with Ads': 'Netflix',
    'Netflix basic with Ads': 'Netflix',
    'Netflix Kids': 'Netflix',
    'Hulu': 'Hulu',
    'Amazon Prime Video': 'Amazon Prime Video',
    'Amazon Prime Video with Ads': 'Amazon Prime Video',
    'Prime Video': 'Amazon Prime Video',
    'Disney+': 'Disney+',
    'Disney Plus': 'Disney+',
    'Max': 'Max',
    'HBO Max': 'Max',
    'Paramount+': 'Paramount+',
    'Paramount+ Amazon Channel': 'Paramount+',
    'Paramount+ Apple TV Channel': 'Paramount+',
    'Paramount Plus': 'Paramount+',
    'Paramount Plus Apple TV Channel': 'Paramount+',
    'Peacock': 'Peacock',
    'Peacock Premium': 'Peacock',
    'Peacock Premium Plus': 'Peacock',
    'Apple TV+': 'Apple TV+',
    'Apple TV Plus': 'Apple TV+',
    'Apple TV': 'Apple TV+',          // TMDB uses "Apple TV" (ID 350) for the Apple TV+ service
    'Starz': 'Starz',
    'Starz Apple TV Channel': 'Starz',
    'Starz Amazon Channel': 'Starz',
    'Starz Roku Premium Channel': 'Starz',
    'MGM+': 'MGM+',
    'MGM+ Amazon Channel': 'MGM+',
    'AMC+': 'AMC+',
    'AMC+ Amazon Channel': 'AMC+',
    'AMC Plus': 'AMC+',
    'Tubi TV': 'Tubi',
    'Tubi': 'Tubi',
    'Pluto TV': 'Pluto TV',
    'The Roku Channel': 'Roku',
    'Roku Channel': 'Roku',
};
const PREFERRED_ORDER = [
    'Netflix', 'Hulu', 'Amazon Prime Video', 'Disney+', 'Max',
    'Paramount+', 'Peacock', 'Apple TV+', 'Starz', 'MGM+', 'AMC+',
    'Tubi', 'Pluto TV', 'Roku'
];
function buzzOf(i){ if(i.buzz) return i.buzz; const w=i.watchers||0,v=i.votes||0,r=i.rating||0; return v>0?(Math.log10(Math.max(v,1))*15+r*3+w*0.1):w*0.5; }
// Build Discovery's exact provider LOGO bar into barEl from data; toggling updates activeSet + calls onChange.
function buildProviderBar(barEl, data, activeSet, onChange){
  const canonData={};
  data.forEach(item => { const seen=new Set(); (item.providers||[]).forEach(p => {
    const canon=PROVIDER_NORMALIZE[p.name]; if(!canon||!p.logo||seen.has(canon)) return; seen.add(canon);
    if(!canonData[canon]) canonData[canon]={count:0,logo:p.logo}; canonData[canon].count++;
    const isChannel=p.name.includes('Amazon Channel')||p.name.includes('Apple TV Channel'); if(!isChannel) canonData[canon].logo=p.logo;
  }); });
  PREFERRED_ORDER.forEach(name => { const d=canonData[name]; if(!d) return;
    const btn=document.createElement('button'); btn.className='provider-btn'; btn.title=name+' ('+d.count+')'; btn.dataset.provider=name;
    btn.innerHTML='<img src="'+d.logo+'" alt="'+name+'">';
    btn.addEventListener('click', ()=>{ if(activeSet.has(name)){activeSet.delete(name);btn.classList.remove('active');}else{activeSet.add(name);btn.classList.add('active');} onChange(); });
    barEl.appendChild(btn);
  });
}
function providerMatch(item, activeSet){ if(!activeSet.size) return true; return (item.providers||[]).some(p => activeSet.has(PROVIDER_NORMALIZE[p.name])); }



// ── Shared TMDB picker: search /api/search, render results, hand the choice back ──
const PICKER_API = 'https://media-hub-api.agreiter81.workers.dev';
function _idpickOverlay() {
    let ov = document.getElementById('idpick-overlay');
    if (ov) return ov;
    ov = document.createElement('div');
    ov.id = 'idpick-overlay';
    ov.className = 'idpick-overlay';
    ov.onclick = function(e) { if (e.target === ov) ov.style.display = 'none'; };
    ov.innerHTML = '<div class="idpick-modal">' +
        '<button class="idpick-close" onclick="document.getElementById(\'idpick-overlay\').style.display=\'none\'">&times;</button>' +
        '<h3 id="idpick-h">Pick the correct title</h3>' +
        '<div id="idpick-results" class="idpick-results"></div></div>';
    document.body.appendChild(ov);
    return ov;
}
// opts: { title, type ('movie'|'tv'), heading?, allowNone? (button label),
//         onPick(result, el), onNone?(el) }
async function openTmdbPicker(opts) {
    const ov = _idpickOverlay();
    ov.querySelector('#idpick-h').textContent = opts.heading || ('Pick the correct title for "' + opts.title + '"');
    const box = ov.querySelector('#idpick-results');
    box.innerHTML = '<div class="idpick-loading">Searching TMDB…</div>';
    ov.style.display = 'flex';
    window._idpickOnPick = opts.onPick || null;
    window._idpickOnNone = opts.onNone || null;
    try {
        const r = await fetch(PICKER_API + '/api/search?q=' + encodeURIComponent(opts.title) +
            '&type=' + (opts.type === 'movie' ? 'movie' : 'tv'));
        const data = await r.json();
        const results = data.results || [];
        window._idpickResults = results;
        let html = results.map(function(x, i) {
            const poster = x.poster ? '<img src="' + x.poster + '" alt="">' : '<div class="idpick-noimg">🎬</div>';
            return '<button class="idpick-item" onclick="_idpickChoose(' + i + ', this)">' + poster +
                '<div class="idpick-meta"><div class="idpick-title">' + (x.title || '') +
                (x.year ? ' <span>(' + x.year + ')</span>' : '') + '</div>' +
                '<div class="idpick-sub">TMDB #' + x.id + (x.rating ? ' · ★ ' + x.rating : '') + '</div></div></button>';
        }).join('');
        if (!results.length) html = '<div class="idpick-loading">No TMDB matches found.</div>';
        if (opts.allowNone) html += '<button class="idpick-item idpick-none" onclick="_idpickNone(this)">' +
            '<div class="idpick-noimg">➕</div><div class="idpick-meta"><div class="idpick-title">' + opts.allowNone +
            '</div><div class="idpick-sub">Save with no TMDB match (for pre-TMDB titles)</div></div></button>';
        box.innerHTML = html;
    } catch (e) {
        box.innerHTML = '<div class="idpick-loading">Search failed. Try again.</div>';
    }
}
function _idpickChoose(i, el) {
    const res = (window._idpickResults || [])[i];
    if (res && window._idpickOnPick) window._idpickOnPick(res, el);
}
function _idpickNone(el) { if (window._idpickOnNone) window._idpickOnNone(el); }
function _idpickClose() { const ov = document.getElementById('idpick-overlay'); if (ov) ov.style.display = 'none'; }


const S = { kind:'both', type:'all', search:'', nets:new Set(), genres:new Set(), hideWL:false, hideWatched:false, sort:'date' };
function fmtDate(d){ try { return new Date(d + 'T12:00:00').toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'}); } catch(e){ return d; } }
function nEsc(s){ const d=document.createElement('div'); d.textContent=(s==null?'':s); return d.innerHTML; }
const alphaKey = t => (t||'').toLowerCase().replace(/^(the|a|an)\s+/,'').trim();

// Provider LOGO bar (Discovery's exact builder) + genre chips.
buildProviderBar(document.getElementById('nos-networks'), ALL_DATA, S.nets, apply);
(function buildGenres(){
  const gens={}; ALL_DATA.forEach(i => (i.genres||[]).forEach(g=>gens[g]=(gens[g]||0)+1));
  document.getElementById('nos-genres').innerHTML = Object.keys(gens).sort((a,b)=>gens[b]-gens[a]).map(g =>
    `<button class="genre-chip" data-genre="${nEsc(g)}">${nEsc(g)}</button>`).join('');
})();

function nosHasActive(){ return S.kind!=='both'||S.type!=='all'||!!S.search||S.nets.size>0||S.genres.size>0||S.hideWL||S.hideWatched||S.sort!=='date'; }
function updateReset(){ const b=document.getElementById('nos-reset'); if(b) b.style.display = nosHasActive()?'':'none'; }
function resetFilters(){
  S.kind='both'; S.type='all'; S.search=''; S.nets.clear(); S.genres.clear(); S.hideWL=false; S.hideWatched=false; S.sort='date';
  document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active', x.dataset.kind==='both'));
  document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active', x.dataset.type==='all'));
  const si=document.getElementById('nos-search'); if(si) si.value='';
  const so=document.getElementById('nos-sort'); if(so) so.value='date';
  const hw=document.getElementById('nos-hidewl'); if(hw) hw.checked=false;
  const hd=document.getElementById('nos-hidewatched'); if(hd) hd.checked=false;
  document.querySelectorAll('#nos-networks .provider-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('#nos-genres .genre-chip').forEach(c=>c.classList.remove('active'));
  apply();
}
function apply(){
  updateReset();
  const items = ALL_DATA.filter(i => {
    if (S.kind === 'arriving' && !(i._kind === 'arriving' || i._kind === 'moving')) return false;
    if (S.kind === 'leaving'  && !(i._kind === 'leaving'  || i._kind === 'moving')) return false;
    if (S.type !== 'all' && i.type !== S.type) return false;
    if (!providerMatch(i, S.nets)) return false;
    if (S.genres.size && !(i.genres||[]).some(g => S.genres.has(g))) return false;
    if (S.hideWL && i.status === 'watchlist') return false;
    if (S.hideWatched && i.status === 'watched') return false;
    if (S.search && !(i.title||'').toLowerCase().includes(S.search)
        && !((i.actors||[]).some(a => (a||'').toLowerCase().includes(S.search)))) return false;
    return true;
  });
  document.getElementById('nos-count').textContent = items.length + ' titles';
  const cal = document.getElementById('cal');
  if (!items.length){ cal.innerHTML = '<div class="empty">No titles match your filters.</div>'; return; }
  if (S.sort === 'buzz'){
    items.sort((a,b)=> buzzOf(b)-buzzOf(a) || alphaKey(a.title).localeCompare(alphaKey(b.title)));
    cal.innerHTML = `<div class="grid">${items.map(renderCard).join('')}</div>`; return;
  }
  if (S.sort === 'title'){
    items.sort((a,b)=> alphaKey(a.title).localeCompare(alphaKey(b.title)));
    cal.innerHTML = `<div class="grid">${items.map(renderCard).join('')}</div>`; return;
  }
  if (S.sort === 'rating'){
    items.sort((a,b)=> (b.rating||0)-(a.rating||0) || alphaKey(a.title).localeCompare(alphaKey(b.title)));
    cal.innerHTML = `<div class="grid">${items.map(renderCard).join('')}</div>`; return;
  }
  const byDate = {};
  items.forEach(i => { const k=i._date||'zzz'; (byDate[k]=byDate[k]||[]).push(i); });
  const dates = Object.keys(byDate).filter(d=>d!=='zzz').sort();
  cal.innerHTML = dates.map(d => `<div class="date-group"><h3 class="date-h">${fmtDate(d)}</h3><div class="grid">${byDate[d].map(renderCard).join('')}</div></div>`).join('');
}

document.querySelectorAll('[data-kind]').forEach(b => b.addEventListener('click', ()=>{ S.kind=b.dataset.kind; document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b)); apply(); }));
document.querySelectorAll('[data-type]').forEach(b => b.addEventListener('click', ()=>{ S.type=b.dataset.type; document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b)); apply(); }));
document.getElementById('nos-genres').addEventListener('click', e=>{ const b=e.target.closest('[data-genre]'); if(!b)return; const g=b.dataset.genre; if(S.genres.has(g)){S.genres.delete(g);b.classList.remove('active');}else{S.genres.add(g);b.classList.add('active');} apply(); });
document.getElementById('nos-hidewl').addEventListener('change',e=>{S.hideWL=e.target.checked;apply();});
document.getElementById('nos-hidewatched').addEventListener('change',e=>{S.hideWatched=e.target.checked;apply();});
document.getElementById('nos-sort').addEventListener('change',e=>{S.sort=e.target.value;apply();});
let _st; document.getElementById('nos-search').addEventListener('input',e=>{clearTimeout(_st);_st=setTimeout(()=>{S.search=e.target.value.toLowerCase().trim();apply();},200);});
document.getElementById('nos-genre-toggle').addEventListener('click',()=>{ const g=document.getElementById('nos-genres'); g.classList.toggle('expanded'); document.getElementById('nos-genre-toggle').textContent = 'Genres ' + (g.classList.contains('expanded')?'\u25B4':'\u25BE'); });
document.getElementById('nos-reset').addEventListener('click', resetFilters);
(function(){ var uq=new URLSearchParams(location.search).get('q'); if(uq){ S.search=uq.toLowerCase().trim(); var si=document.getElementById('nos-search'); if(si) si.value=uq; } })();
apply();

</script>
